kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "API_DIR=.; if [ ! -f cpp/library_api.cpp ]; then API_DIR=artifacts/api-server; fi; cd \"$API_DIR\" && mkdir -p bin && g++ $NIX_CFLAGS_COMPILE -std=c++17 -O2 -Wall -Wextra -pthread cpp/library_api.cpp $(pkg-config --cflags --libs libpq) -o bin/library-api && exec bin/library-api"

[services.production]

[services.production.build]
args = ["bash", "-lc", "if [ ! -f cpp/library_api.cpp ]; then cd artifacts/api-server; fi; mkdir -p bin && g++ $NIX_CFLAGS_COMPILE -std=c++17 -O2 -pthread cpp/library_api.cpp $(pkg-config --cflags --libs libpq) -o bin/library-api"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["bash", "-lc", "if [ -f artifacts/api-server/bin/library-api ]; then cd artifacts/api-server; fi; exec ./bin/library-api"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"